<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="180mm" height="129.5172mm" viewBox="30 56 1740 1252" role="img" aria-labelledby="title desc">
<title id="title">Reference-matched host annotation architecture in MTD Explorer</title>
<desc id="desc">Coordinated genome, GTF and protein resources support gene-ID-matched protein annotation and host quantification. GTF metadata and eggNOG assignments support a custom OrgDb. GO master GMT is a parallel product of eggNOG GO assignments. The master is matched to the expression input to produce an analysis-specific GMT for ssGSEA in the comparison route.</desc>
<text x="60" y="106" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" font-style="normal" text-anchor="start" fill="#20303B">Reference-matched host annotation</text>
